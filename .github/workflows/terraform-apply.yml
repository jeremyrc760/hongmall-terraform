
name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Reviewed Terraform Main Plan Run ID"
        required: true
        type: string
      approved_plan_sha256:
        description: "SHA-256 of the reviewed change.tfplan (64 lowercase hex chars)"
        required: true
        type: string
      approved_manifest_version_id:
        description: "Approved S3 Manifest Version ID"
        required: true
        type: string
      approved_risk_level:
        description: "Reviewed OPA Overall Risk (must match the S3 Manifest)"
        required: true
        type: choice
        options:
          - low
          - medium
          - high

permissions:
  contents: read
  actions: read

concurrency:
  group: hongmall-terraform-cloudwatch
  cancel-in-progress: false

jobs:
  # Extra approval is required only for Medium risk.
  # Configure required reviewers in the production-medium Environment.
  medium-risk-approval:
    name: Medium Risk Approval
    if: github.ref == 'refs/heads/main' && inputs.approved_risk_level == 'medium'
    runs-on: ubuntu-latest
    environment: production-medium
    permissions:
      contents: read
    steps:
      - name: Confirm Medium approval protection is configured
        env:
          APPROVAL_CONFIGURED: ${{ vars.RISK_APPROVAL_CONFIGURED }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVAL_CONFIGURED" == "true" ]] || {
            echo "::error::production-medium approval protection has not been enabled"
            exit 1
          }
          echo "Medium-risk approval gate completed."

  # High risk uses a separate reviewer group / Environment.
  high-risk-approval:
    name: High Risk Approval
    if: github.ref == 'refs/heads/main' && inputs.approved_risk_level == 'high'
    runs-on: ubuntu-latest
    environment: production-high
    permissions:
      contents: read
    steps:
      - name: Confirm High approval protection is configured
        env:
          APPROVAL_CONFIGURED: ${{ vars.RISK_APPROVAL_CONFIGURED }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVAL_CONFIGURED" == "true" ]] || {
            echo "::error::production-high approval protection has not been enabled"
            exit 1
          }
          echo "High-risk approval gate completed."

  terraform-apply:
    name: Apply Reviewed Terraform Main Plan
    needs:
      - medium-risk-approval
      - high-risk-approval
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        (
          (inputs.approved_risk_level == 'low' &&
           needs.medium-risk-approval.result == 'skipped' &&
           needs.high-risk-approval.result == 'skipped') ||
          (inputs.approved_risk_level == 'medium' &&
           needs.medium-risk-approval.result == 'success' &&
           needs.high-risk-approval.result == 'skipped') ||
          (inputs.approved_risk_level == 'high' &&
           needs.high-risk-approval.result == 'success' &&
           needs.medium-risk-approval.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      GH_TOKEN: ${{ github.token }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
      APPROVED_MANIFEST_VERSION_ID: ${{ inputs.approved_manifest_version_id }}
      APPROVED_RISK_LEVEL: ${{ inputs.approved_risk_level }}
      PLAN_BUCKET: hongmall-terraform-plans-697196251337
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Terraform Plan run
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid Plan Run ID"
            exit 1
          }
          [[ "$APPROVED_PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Invalid reviewed Plan SHA-256"
            exit 1
          }
          [[ "$APPROVED_RISK_LEVEL" =~ ^(low|medium|high)$ ]] || {
            echo "::error::Invalid approved risk level"
            exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" > plan-run.json

          jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg repo "$GITHUB_REPOSITORY" '
              .status == "completed"
              and .conclusion == "success"
              and (.event == "push" or .event == "workflow_dispatch")
              and .head_branch == "main"
              and .head_sha == $sha
              and .head_repository.full_name == $repo
              and .path == ".github/workflows/terraform-plan.yml"
              and (.run_attempt | type == "number" and . >= 1)
            ' plan-run.json > /dev/null || {
              echo "::error::Untrusted or mismatched Terraform Plan run"
              exit 1
            }

          # Fail closed when the selected Plan has become too old.
          CREATED_AT=$(jq -er '.created_at' plan-run.json)
          CREATED_EPOCH=$(date -u -d "$CREATED_AT" +%s)
          NOW_EPOCH=$(date -u +%s)
          (( NOW_EPOCH >= CREATED_EPOCH && NOW_EPOCH - CREATED_EPOCH <= 72 * 3600 )) || {
            echo "::error::Plan is older than 72 hours; generate and review a new Plan"
            exit 1
          }

          echo "Verified Plan run source, commit, and age."

      - name: Verify Main Plan passed OPA
        shell: bash
        run: |
          set -euo pipefail

          RUN_ATTEMPT=$(jq -er '.run_attempt' plan-run.json)

          OPA_PASSED=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '
              [
                .jobs[]
                | select(
                    .name == "Terraform Plan"
                    and .conclusion == "success"
                  )
                | .steps[]
                | select(
                    .name == "OPA Policy Gate"
                    and .conclusion == "success"
                  )
              ] | length > 0
            ')

          if [[ "$OPA_PASSED" != "true" ]]; then
            echo "::error::Main Plan did not pass OPA Policy Gate"
            exit 1
          fi

          echo "Main Plan OPA verification passed."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::697196251337:role/HongMallTerraformApplyRole
          aws-region: us-east-1
          role-session-name: hongmall-terraform-apply
          allowed-account-ids: "697196251337"
          disable-retry: true

      - name: Download and verify reviewed S3 Main Plan
        shell: bash
        run: |
          set -euo pipefail

          RUN_ATTEMPT=$(jq -er '.run_attempt | tostring' plan-run.json)
          PLAN_PREFIX="main/${GITHUB_SHA}/${PLAN_RUN_ID}/${RUN_ATTEMPT}"
          PLAN_KEY="${PLAN_PREFIX}/change.tfplan"
          REVIEW_KEY="${PLAN_PREFIX}/plan-review.txt"
          MANIFEST_KEY="${PLAN_PREFIX}/manifest.json"

          aws s3api get-object \
            --bucket "$PLAN_BUCKET" \
            --key "$MANIFEST_KEY" \
            --version-id "$APPROVED_MANIFEST_VERSION_ID" \
            manifest.json > /dev/null

          # Check the risk routing input against the immutable Plan metadata.
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg run_id "$PLAN_RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg bucket "$PLAN_BUCKET" \
            --arg plan_key "$PLAN_KEY" \
            --arg review_key "$REVIEW_KEY" \
            --arg approved_sha "$APPROVED_PLAN_SHA256" \
            --arg approved_risk "$APPROVED_RISK_LEVEL" '
              .repository == $repo
              and .branch == "main"
              and .commit_sha == $sha
              and .workflow == ".github/workflows/terraform-plan.yml"
              and .run_id == $run_id
              and .run_attempt == $run_attempt
              and .terraform_version == "1.15.8"
              and .bucket == $bucket
              and (.risk_level == $approved_risk)
              and (.risk_level == "low" or .risk_level == "medium" or .risk_level == "high")
              and .plan.key == $plan_key
              and .plan.sha256 == $approved_sha
              and (.plan.version_id | type == "string" and length > 0 and . != "null")
              and .review.key == $review_key
              and (.review.version_id | type == "string" and length > 0 and . != "null")
              and (.review.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
            ' manifest.json > /dev/null || {
              echo "::error::S3 Plan manifest does not match the approved risk and Plan"
              exit 1
            }

          PLAN_VERSION=$(jq -er '.plan.version_id' manifest.json)
          mkdir -p approved-plan
          aws s3api get-object \
            --bucket "$PLAN_BUCKET" \
            --key "$PLAN_KEY" \
            --version-id "$PLAN_VERSION" \
            approved-plan/change.tfplan > /dev/null

          test -s approved-plan/change.tfplan
          ACTUAL_SHA256=$(sha256sum approved-plan/change.tfplan | awk '{print $1}')
          [[ "$ACTUAL_SHA256" == "$APPROVED_PLAN_SHA256" ]] || {
            echo "::error::Downloaded Terraform Plan SHA-256 mismatch"
            exit 1
          }

          echo "Reviewed Plan provenance, risk level, S3 object version, and hash verified."

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Install OPA for Apply verification
        shell: bash
        run: |
          set -euo pipefail
          OPA_VERSION="1.21.4"
          curl -fsSL --retry 3 \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" \
            -o /tmp/opa
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          rm -f /tmp/opa
          opa version

      - name: Validate Terraform Plan and risk
        id: validation
        shell: bash
        run: |
          set -euo pipefail

          terraform show -json approved-plan/change.tfplan > plan.json

          # Recompute risk from the exact approved Plan and checked-out policy.
          opa check --strict policies/risk_policy.rego
          POLICY_PASS=$(opa eval \
            --data policies/risk_policy.rego \
            --data policies/resource_classification.json \
            --input plan.json \
            --format raw \
            'data.terraform.risk.policy_pass')
          [[ "$POLICY_PASS" == "true" ]] || {
            echo "::error::Approved Plan fails OPA re-evaluation"
            exit 1
          }

          CALCULATED_RISK=$(opa eval \
            --data policies/risk_policy.rego \
            --data policies/resource_classification.json \
            --input plan.json \
            --format raw \
            'data.terraform.risk.overall_risk')
          MANIFEST_RISK=$(jq -er '.risk_level' manifest.json)
          [[ "$CALCULATED_RISK" == "$MANIFEST_RISK" &&
             "$CALCULATED_RISK" == "$APPROVED_RISK_LEVEL" ]] || {
            echo "::error::OPA risk does not match approved risk and Manifest"
            exit 1
          }
          echo "Verified OPA Overall Risk: $CALCULATED_RISK"

          # Preserve existing restriction: no deletes or replacements.
          jq -e '
            all(.resource_changes[]?;
              ((.change.actions // []) | index("delete") | not)
            )
          ' plan.json > /dev/null || {
            echo "::error::Deletes and replacements are not permitted in this phase"
            exit 1
          }

          # Reject actual output changes; ignore no-op outputs.
          jq -e '
            all((.output_changes // {})[];
              ((.change.actions // ["no-op"]) == ["no-op"])
            )
          ' plan.json > /dev/null || {
            echo "::error::Actual Terraform output changes require separate review"
            exit 1
          }

          # Import-only changes are valid. A truly empty Plan is skipped.
          HAS_CHANGES=$(jq -r '
            [(.resource_changes // [])[] |
              select(
                (.change.importing != null) or
                ((.change.actions // ["no-op"]) != ["no-op"])
              )
            ]
            | length > 0
          ' plan.json)

          if [[ "$HAS_CHANGES" == "true" ]]; then
            echo "should_apply=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_CHANGES" == "false" ]]; then
            echo "should_apply=false" >> "$GITHUB_OUTPUT"
            echo "Terraform Plan contains no actionable resource changes; skipping Apply."
          else
            echo "::error::Unexpected Plan validation result"
            exit 1
          fi

      - name: Verify main has not advanced
        if: steps.validation.outputs.should_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$CURRENT_MAIN_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::main advanced since this approved Plan; generate and review a new Plan"
            exit 1
          }

      - name: Terraform Apply
        if: steps.validation.outputs.should_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          terraform apply \
            -input=false \
            -no-color \
            approved-plan/change.tfplan

      - name: Remove temporary plan and metadata files
        if: always()
        shell: bash
        run: |
          rm -f manifest.json plan-run.json plan.json approved-plan/change.tfplan
