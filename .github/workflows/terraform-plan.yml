
name: Terraform Plan

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tfvars.json"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"
      - "policies/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hongmall-terraform-cloudwatch
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::697196251337:role/HongMallTerraformPlanRole
          aws-region: us-east-1
          role-session-name: hongmall-terraform-plan
          allowed-account-ids: "697196251337"
          disable-retry: true

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=change.tfplan

      - name: Display Terraform Plan
        run: |
          terraform show -no-color change.tfplan \
            > plan-summary.txt

          cat plan-summary.txt

          {
            echo "## Terraform Plan"
            echo '```text'
            cat plan-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: change.tfplan
          if-no-files-found: error
          retention-days: 3
