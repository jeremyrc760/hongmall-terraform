name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-oidc:
    name: Inspect main OIDC identity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Inspect OIDC subject
        shell: bash
        run: |
          response=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          jwt=$(echo "$response" | jq -r '.value')
          payload=$(echo "$jwt" | cut -d '.' -f 2)

          echo "$payload" | base64 -d 2>/dev/null | jq '{iss, aud, sub}'