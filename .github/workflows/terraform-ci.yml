
name: Terraform CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (No Backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.59.1

      - name: Initialize TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --format compact

      - name: Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true

  workflow-lint:
    name: GitHub Actions Workflow Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install actionlint
        shell: bash
        run: |
          bash <(curl -fsSL \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            1.7.12

      - name: Run actionlint
        run: ./actionlint -color

  terraform-pr-plan:
    name: Terraform PR Plan
    needs:
      - terraform-checks
      - workflow-lint
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify prerequisite CI checks
        env:
          FORMAT_RESULT: ${{ needs.terraform-checks.result }}
          LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          if [[ "$FORMAT_RESULT" != "success" ||
                "$LINT_RESULT" != "success" ]]; then
            echo "::error::Prerequisite CI checks did not pass"
            exit 1
          fi

      - name: Verify trusted PR
        shell: bash
        env:
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          RUN_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail

          if [[ "$SOURCE_REPO" != "$TARGET_REPO" ||
                "$PR_AUTHOR_ID" != "202478535" ||
                "$RUN_ACTOR_ID" != "202478535" ]]; then
            echo "::error::Untrusted PR source"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::697196251337:role/HongMallTerraformPRPlanRole
          aws-region: us-east-1
          role-session-name: hongmall-terraform-pr-plan
          allowed-account-ids: "697196251337"
          disable-retry: true

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform PR Plan
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -no-color \
            -out=pr-change.tfplan > /dev/null

          terraform show -json pr-change.tfplan |
            jq -r '
              [.resource_changes[]?.change.actions] as $a |
              "## Terraform PR Plan\n\n" +
              "| Action | Count |\n" +
              "|---|---:|\n" +
              "| Create | \($a | map(select(. == ["create"])) | length) |\n" +
              "| Update | \($a | map(select(. == ["update"])) | length) |\n" +
              "| Delete | \($a | map(select(. == ["delete"])) | length) |\n" +
              "| Replace | \($a | map(select(index("delete") != null and index("create") != null)) | length) |"
            ' >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------
      # OPA Policy as Code
      # ----------------------------------------

      - name: Install OPA
        shell: bash
        run: |
          set -euo pipefail

          OPA_VERSION="1.21.4"

          curl -fsSL --retry 3 \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" \
            -o /tmp/opa

          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          rm -f /tmp/opa

          opa version

      
      - name: OPA Policy Gate
        shell: bash
        run: |
          set -euo pipefail

          trap 'rm -f plan.json pr-change.tfplan' EXIT

          terraform show -json pr-change.tfplan > plan.json

          opa check --strict policies/risk_policy.rego

          # Evaluate OPA decision
          decision="$(opa eval \
            --data policies/risk_policy.rego \
            --data policies/resource_classification.json \
            --input plan.json \
            --format raw \
            'data.terraform.risk.policy_pass')"

          echo "OPA Policy Decision: $decision"

          # Explicitly reject anything other than true
          if [[ "$decision" != "true" ]]; then
            echo "::error::OPA Policy Gate rejected the change"
            exit 1
          fi

          echo "OPA Policy Gate passed." >> "$GITHUB_STEP_SUMMARY"

